version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: twinmind-postgres
    environment:
      POSTGRES_DB: twinmind
      POSTGRES_USER: twinmind
      POSTGRES_PASSWORD: twinmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    container_name: twinmind-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  neo4j:
    image: neo4j:5.18-community
    restart: unless-stopped
    container_name: twinmind-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/twinmindgraph
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  chroma_data:
  neo4j_data:
